# ===============================
# PORTA (IMPORTANTE PARA RENDER)
# ===============================
server.port=${PORT:8080}

# ===============================
# BASE DE DADOS (MYSQL ONLINE)
# ===============================
spring.datasource.url=jdbc:mysql://HOST:PORT/NOME_DB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=USER
spring.datasource.password=PASSWORD

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# CONEXÃO (EVITA ERROS NO RENDER)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# ===============================
# H2 DESATIVADO (IMPORTANTE)
# ===============================
spring.h2.console.enabled=false